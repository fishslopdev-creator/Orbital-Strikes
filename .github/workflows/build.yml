name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Smoke test on a dedicated server
        timeout-minutes: 15
        run: |
          mkdir -p build/smoke-test
          echo 'eula=true' > build/smoke-test/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\n' > build/smoke-test/server.properties
          ./gradlew runSmokeTest --stacktrace 2>&1 | tee build/smoke-test.log
          grep -q 'ORBITAL STRIKES SMOKE TEST PASSED' build/smoke-test.log
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: orbital-strikes
          path: build/libs/*.jar
